<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Flashcards</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #dde1e7;
    --accent: #2563eb;
    --good: #16a34a;
    --bad: #dc2626;
    --star: #f59e0b;
    --onColor: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --card: #1e222b; --text: #e8eaef; --muted: #9aa1ad; --border: #333946;
      --accent: #6b9bff; --good: #22a35a; --bad: #e0474a; --star: #fbbf24; --onColor: #ffffff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --card: #1e222b; --text: #e8eaef; --muted: #9aa1ad; --border: #333946;
    --accent: #6b9bff; --good: #22a35a; --bad: #e0474a; --star: #fbbf24; --onColor: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; }
  .controls select { font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .controls input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
  .controls .spacer { flex: 1; }

  .stats {
    display: flex; justify-content: space-between; margin: 14px 4px 8px;
    color: var(--muted); font-size: 15px;
  }
  .stats b { color: var(--text); }

  .card {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    min-height: 280px; padding: 40px 20px 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .badge {
    position: absolute; top: 12px; left: 14px;
    font-size: 13px; color: var(--muted); background: var(--bg);
    padding: 2px 8px; border-radius: 6px;
  }
  .starBtn {
    position: absolute; top: 6px; right: 8px;
    font-size: 30px; line-height: 1; background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 6px;
  }
  .starBtn.on { color: var(--star); }
  .english {
    font-size: clamp(28px, 7vw, 44px); font-weight: 700; word-break: break-word;
  }
  .english .mark { color: var(--star); margin-left: 8px; }
  .turkish {
    margin-top: 18px; font-size: clamp(22px, 5.5vw, 32px); color: var(--accent);
    min-height: 1.3em; word-break: break-word;
  }
  .hidden { display: none !important; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  button.btn {
    font-size: 17px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; min-width: 140px;
  }
  button.btn:hover { filter: brightness(0.97); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--onColor); border-color: var(--accent); }
  button.good { background: var(--good); color: var(--onColor); border-color: var(--good); }
  button.bad { background: var(--bad); color: var(--onColor); border-color: var(--bad); }
  button.small { font-size: 14px; padding: 7px 12px; min-width: 0; }
  kbd {
    font-family: inherit; font-size: .75em; opacity: .8;
    border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 4px;
  }

  .summary h2 { margin: 0 0 12px; }
  .summary .nums { font-size: 20px; line-height: 1.8; }
  .summary .nums .k { color: var(--good); font-weight: 700; }
  .summary .nums .d { color: var(--bad); font-weight: 700; }
  .empty { color: var(--muted); font-size: 18px; }

.confirmBar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--bad); background: var(--card);
  }
  .confirmBar span { font-weight: 600; }
  .confirmBar div { display: flex; gap: 8px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .help { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }

  @media (max-width: 480px) {
    .controls { gap: 8px; }
    .controls .spacer { display: none; }
    button.btn { flex: 1 1 45%; min-width: 0; }
    kbd { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="controls">
    <label>List
      <select id="listSel">
        <option value="L1">L1</option>
        <option value="L2">L2</option>
        <option value="L3">L3</option>
        <option value="All">All</option>
      </select>
    </label>
    <label><input type="checkbox" id="starOnly"> Starred only</label>
    <label><input type="checkbox" id="shuffle"> Shuffle</label>
    <span class="spacer"></span>
    <button class="btn small" id="clearStars">Clear all stars</button>
  </div>

  <div class="confirmBar hidden" id="confirmBar">
    <span>Are you sure? This removes all stars from every list.</span>
    <div>
      <button class="btn small bad" id="confirmYes">Yes, clear</button>
      <button class="btn small" id="confirmNo">Cancel</button>
    </div>
  </div>

  <div class="stats">
    <span>Card <b id="pos">0 / 0</b></span>
    <span>★ Starred in list: <b id="starCount">0</b></span>
  </div>

  <!-- Flashcard view -->
  <div id="cardView">
    <div class="card">
      <span class="badge" id="badge"></span>
      <button class="starBtn" id="starBtn" title="Star / unstar this word">★</button>
      <div class="english" id="english"></div>
      <div class="turkish" id="turkish"></div>
    </div>
    <div class="actions">
      <button class="btn" id="prevBtn">← Previous</button>
      <button class="btn primary" id="showBtn">Show Turkish <kbd>Space</kbd></button>
      <button class="btn good hidden" id="knewBtn">I knew it <kbd>K</kbd></button>
      <button class="btn bad hidden" id="didntBtn">I didn't know it <kbd>D</kbd></button>
    </div>
  </div>

  <!-- Empty state -->
  <div id="emptyView" class="card hidden">
    <div class="empty" id="emptyMsg"></div>
  </div>

  <!-- Summary view -->
  <div id="summaryView" class="card summary hidden">
    <h2>Round finished!</h2>
    <div class="nums">
      <div>I knew: <span class="k" id="sumKnew">0</span></div>
      <div>I didn't know: <span class="d" id="sumDidnt">0</span></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="restartBtn">Restart</button>
      <button class="btn" id="practiceStarBtn">Practice starred words</button>
    </div>
  </div>

  <div class="help">Keys: Space = show Turkish · K = I knew it · D = I didn't know it · ← = previous</div>
</div>

<script>
// ---------- Word lists (exactly as given) ----------
const RAW = {
L1: `Climbing = Tırmanma sporu
Do crossword puzzles = Bulmaca çözmek
Do martial arts = Uzakdoğu sporları yapmak
Fishing = Balık tutma
Photography = Fotoğrafçılık
Play chess = Satranç oynamak
Play tennis = Tenis oynamak
Play the guitar = Gitar çalmak
Sculpture = Heykelcilik
Snowboarding = Snowboard sporu
Surfing = Sörf sporu
Swimming = Yüzme
Take photos = Fotoğraf çekmek
Read magazines = Dergi okumak
Embroidery = Nakış
Write blogs = Blog yazmak
Pottery = Çömlekçilik
Gardening = Bahçecilik
Do cycling = Bisiklet sporu yapmak
Do camping = Kamp yapmak
Make jewelry = Takı yapmak
Go hiking = Yürüyüş sporu yapmak
Arts and crafts = Sanat ve El sanatları
Improve = Düzeltmek-Düzelmek
Play table tennis = Masa tenisi oynamak
Learn foreign languages = Yabancı dil öğrenmek
Indoor activities = Kapalı alan aktiviteleri
Outdoor activities = Açık alan aktiviteleri
Physical health = Beden sağlığı
Mental health = Akıl sağlığı
Free-time = Boş vakit
Build websites = Web sitesi yapmak
Design websites = Web sitesi tasarlamak
Watch documentaries = Belgesel izlemek
Feel relaxed = Rahatlamak
Nuts and bolts = Basit ayrıntılar
My pleasure = Rica ederim
You can say that again = Doğru, aynı fikirdeyim
Fix ... = ...yi tamir etmek
Glasses = Gözlük
Beach = Sahil
Tent = Çadır
Altruism = Başkalarını düşünme`,
L2: `Dislike = Hoşlanmamak
Science fiction = Bilim kurgu
Once a week = Haftada bir kez
Twice a week = Haftada iki kez
Specialise = Uzmanlaşmak
Japanese = Japonca
Chinese = Çince
Take up a new hobby = Yeni bir hobiye başlamak
Club = Kulüp
Charity = Hayır kuruluşu
Member = Üye
Scholarship = Burs
Pass away = Ölmek
Inspiration = İlham
Particularly = Özellikle
Admiration = Hayranlık
Incredibly = Son derece
Worldwide = Dünya çapında
Chemist = Kimyacı
Typewriter = Daktilo
Fencing = Eskrim
Philanthropy = Hayırseverlik
Unicycle = Tek tekerlekli bisiklet
Award = Ödül
Sound = Ses
Skillful = Yetenekli
be into ... = ...ya ilgi duymak
Actor = Erkek sinema sanatçısı
Actress = Bayan sinema sanatçısı
Coordination = Kordinasyon
Celebrity = Ünlü kişi
Donate money = Para bağışlamak`,
L3: `Contribution = Katkı
Particularly = Özellikle
Physics = Fizik
Military doctor = Askerî doktor
Attend school = Okula gitmek
Gain = Kazanmak, elde etmek
Admiration = Hayranlık
Incredibly = İnanılmaz derecede
Intelligent = Zeki, akıllı
For this reason = Bu nedenle
Theoretical = Teorik, kuramsal
Faculty = Fakülte
Soon afterwards = Kısa bir süre sonra
Scholarship = Burs
Do his doctorate = Doktorasını yapmak
Postdoctoral studies = Doktora sonrası çalışmalar
Attract attention = Dikkat çekmek
Settle in ... = ...'ya yerleşmek
Pass away = Vefat etmek, hayatını kaybetmek
Inspiration = İlham, esin kaynağı`
};

// Parse "English = Turkish" lines (split on the first " = ")
const WORDS = {};
for (const list of Object.keys(RAW)) {
  WORDS[list] = RAW[list].split("\n").filter(l => l.trim()).map(line => {
    const i = line.indexOf(" = ");
    return { list, en: line.slice(0, i), tr: line.slice(i + 3) };
  });
}

// ---------- Star storage (per list + word) ----------
const STORE_KEY = "flashcards.stars.v1";
let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) {}
const keyOf = w => w.list + "|" + w.en;
const isStarred = w => stars.has(keyOf(w));
function saveStars() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...stars])); } catch (e) {}
}
function setStar(w, on) {
  on ? stars.add(keyOf(w)) : stars.delete(keyOf(w));
  saveStars();
}

// ---------- State ----------
const $ = id => document.getElementById(id);
let deck = [];        // words in this round
let idx = 0;          // current position
let revealed = false;
let results = [];     // per index: "k" | "d" | undefined
let finished = false;

function wordsInSelection() {
  const sel = $("listSel").value;
  return sel === "All" ? [...WORDS.L1, ...WORDS.L2, ...WORDS.L3] : WORDS[sel].slice();
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startRound() {
  let words = wordsInSelection();
  if ($("starOnly").checked) words = words.filter(isStarred);
  if ($("shuffle").checked) shuffleArr(words);
  deck = words;
  idx = 0;
  revealed = false;
  results = [];
  finished = false;
  render();
}

// ---------- Rendering ----------
function render() {
  // Starred count in the selected list (independent of the starred-only filter)
  $("starCount").textContent = wordsInSelection().filter(isStarred).length;

  const showCard = deck.length > 0 && !finished;
  $("cardView").classList.toggle("hidden", !showCard);
  $("summaryView").classList.toggle("hidden", !finished);
  $("emptyView").classList.toggle("hidden", deck.length > 0);

  if (deck.length === 0) {
    $("pos").textContent = "0 / 0";
    $("emptyMsg").textContent = $("starOnly").checked
      ? "No starred words in this list. Nice work!"
      : "No words in this list.";
    return;
  }

  if (finished) {
    $("pos").textContent = deck.length + " / " + deck.length;
    $("sumKnew").textContent = results.filter(r => r === "k").length;
    $("sumDidnt").textContent = results.filter(r => r === "d").length;
    return;
  }

  const w = deck[idx];
  $("pos").textContent = (idx + 1) + " / " + deck.length;
  $("badge").textContent = w.list;

  const starred = isStarred(w);
  const en = $("english");
  en.textContent = w.en;
  if (starred) {
    const m = document.createElement("span");
    m.className = "mark";
    m.textContent = "★";
    en.appendChild(m);
  }
  $("starBtn").classList.toggle("on", starred);
  $("starBtn").textContent = starred ? "★" : "☆";

  $("turkish").textContent = revealed ? w.tr : "";
  $("showBtn").classList.toggle("hidden", revealed);
  $("knewBtn").classList.toggle("hidden", !revealed);
  $("didntBtn").classList.toggle("hidden", !revealed);
  $("prevBtn").disabled = idx === 0;
}

// ---------- Actions ----------
function reveal() {
  if (finished || !deck.length || revealed) return;
  revealed = true;
  render();
}
function next() {
  if (idx < deck.length - 1) { idx++; revealed = false; }
  else { finished = true; }
  render();
}
function answer(knew) {
  if (finished || !deck.length || !revealed) return;
  results[idx] = knew ? "k" : "d";
  if (!knew) setStar(deck[idx], true);   // knowing it never removes a star
  next();
}
function prev() {
  if (!deck.length) return;
  if (finished) { finished = false; idx = deck.length - 1; }
  else if (idx > 0) idx--;
  else return;
  revealed = false;
  render();
}
function toggleStar() {
  if (finished || !deck.length) return;
  const w = deck[idx];
  setStar(w, !isStarred(w));
  render();
}

// ---------- Events ----------
$("showBtn").onclick = reveal;
$("knewBtn").onclick = () => answer(true);
$("didntBtn").onclick = () => answer(false);
$("prevBtn").onclick = prev;
$("starBtn").onclick = toggleStar;
$("restartBtn").onclick = startRound;
$("practiceStarBtn").onclick = () => { $("starOnly").checked = true; startRound(); };
$("listSel").onchange = startRound;
$("starOnly").onchange = startRound;
$("shuffle").onchange = startRound;
$("clearStars").onclick = () => $("confirmBar").classList.remove("hidden");
$("confirmNo").onclick = () => $("confirmBar").classList.add("hidden");
$("confirmYes").onclick = () => {
  $("confirmBar").classList.add("hidden");
  stars.clear();
  saveStars();
  if ($("starOnly").checked) startRound(); else render();
};

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "select" || tag === "input") return;
  const k = e.key;
  if (k === " " || k === "Spacebar") { e.preventDefault(); reveal(); }
  else if (k === "k" || k === "K") answer(true);
  else if (k === "d" || k === "D") answer(false);
  else if (k === "ArrowLeft") { e.preventDefault(); prev(); }
});

// Keep focus off buttons so Space doesn't "click" the last-pressed button
document.addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") e.target.blur();
});

startRound();
</script>
</body>
</html>
